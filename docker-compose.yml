# SEIC — Smart Entrepreneur Investor Connect
# http://<host>:8084
# ────────────────────────
services:
  seic-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seic-app
    env_file: .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app/static:/app/app/static
    networks:
      - seic_net
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

  seic-nginx:
    image: nginx:1.27-alpine
    container_name: seic-nginx
    ports:
      - "8084:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/app/static:ro
    depends_on:
      seic-app:
        condition: service_healthy
    networks:
      - seic_net
    restart: unless-stopped

networks:
  seic_net:
    driver: bridge
    name: seic-network
